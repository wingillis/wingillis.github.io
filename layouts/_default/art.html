{{ define "main" }}
{{- $galleryApp := resources.Get "scripts/gallery-app.js" -}}
<main id="app" class="aurora-page-main shell">
  <header class="aurora-page-hero">
    <p class="aurora-kicker">Creative computation</p>
    <h1>Gallery</h1>
    <div class="aurora-page-summary">{{ .Content }}</div>
  </header>
  <section class="aurora-gallery pure-g" aria-label="3D render gallery">
    <moving-img v-for="s in sources" :url="s"></moving-img>
  </section>
</main>
<script src="{{ $galleryApp.Permalink }}"></script>
{{ end }}
