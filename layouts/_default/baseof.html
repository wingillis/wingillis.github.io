<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="{{ if .IsHome }}home-page{{ else }}aurora-page{{ end }}">
    {{- if .IsHome -}}
      {{- block "main" . -}}{{- end -}}
    {{- else -}}
      <div class="aurora-site aurora-page-layout">
        <div class="aurora-field" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        {{ partial "aurora-nav.html" . }}
        {{- block "main" . -}}{{- end -}}
        {{ partial "aurora-footer.html" . }}
      </div>
      {{ partial "javascripts.html" . }}
    {{- end -}}
  </body>
</html>
