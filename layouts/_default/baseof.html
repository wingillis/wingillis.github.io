<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body{{ if .IsHome }} class="home-page"{{ end }}>
    {{- if not .IsHome -}}
      {{ partial "navbar.html" }}
      {{ partial "social_header.html" . }}
    {{- end -}}
    {{- block "main" . -}}
    {{- end -}}
    {{- if not .IsHome -}}
      {{ partial "javascripts.html" . }}
      {{ partial "footer.html" }}
    {{- end -}}
  </body>
</html>
