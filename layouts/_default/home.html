{{- define "main" -}}
<main class="home-hero">
  <div class="home-hero__content">
    <section class="home-hero__copy">
      {{ .Content }}
      <div class="home-hero__links" aria-label="Explore">
        <a class="home-hero__button" href="/cv/">Explore my science</a>
        <a class="home-hero__text-link" href="/posts/">Read the blog <span aria-hidden="true">→</span></a>
      </div>
      <button class="home-hero__depth-toggle" id="portrait-depth-toggle" type="button" aria-pressed="true">
        <span>Portrait depth</span>
        <span class="home-hero__depth-toggle-state">Puffy</span>
      </button>
    </section>
    <div class="home-hero__portrait">
      {{- with resources.Get "images/profile-nobg.webp" -}}
        <img src="{{ .RelPermalink }}" class="home-hero__portrait-image" alt="Portrait of Winthrop Gillis">
      {{- end -}}
    </div>
  </div>
</main>
{{- with resources.Get "scripts/puffy-toggle.js" -}}
  <script defer src="{{ .RelPermalink }}"></script>
{{- end -}}
{{- end -}}
