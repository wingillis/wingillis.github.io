{{ define "main" }}
<main class="aurora-page-main shell">
  <header class="aurora-page-hero aurora-article-hero">
    <p class="aurora-kicker">{{ .Date.Format "January 02, 2006" }} · {{ printf "%d minute read" .ReadingTime }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="aurora-page-summary">{{ . }}</p>{{ end }}
  </header>
  <article class="aurora-prose aurora-article">
    {{ .Content }}
  </article>
</main>

{{- if .Params.plotly -}}
{{- $plotly := resources.Get "scripts/render_plotly.js" -}}
<script type="text/javascript" src="{{ $plotly.Permalink }}"></script>
{{- end -}}
{{ end }}
