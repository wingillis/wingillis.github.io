projects:
  - title: Real-Time MoSeq
    kicker: Closed-loop behavioral manipulation
    description: Built a system that identifies natural behavior in tens of milliseconds and triggers precisely timed optogenetic interventions.
    impact: From live depth video to experimental action in approximately 50 milliseconds.
    image: images/closed-loop-rl.svg
    url: https://www.nature.com/articles/s41586-022-05611-2
    link_label: Read the Nature paper
    tags:
      - Real-time ML
      - Embedded systems
      - Neuroscience
  - title: MoSeq v2 Ecosystem
    kicker: Open-source scientific software
    description: Led development of a user-friendly Python ecosystem spanning acquisition, modeling, visualization, documentation, and researcher training.
    impact: Turned research code into a platform other laboratories could adopt.
    image: images/syllables_small.png
    url: https://moseq4all.org
    link_label: Explore MoSeq
    tags:
      - Python
      - Data pipelines
      - Developer experience
  - title: Behavioral Modeling at Scale
    kicker: Statistical and deep learning systems
    description: Developed models that reveal structure, identity, age, and variability in large behavioral datasets.
    impact: Connected rigorous quantitative models to interpretable biological questions.
    image: images/pca_clusters.png
    url: /cv/
    link_label: View the research
    tags:
      - Probabilistic models
      - Deep learning
      - Data visualization
  - title: Neural Interface Engineering
    kicker: Hardware-software prototyping
