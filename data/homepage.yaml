about:
  title: Researcher, engineer, and builder
  body: My work lives where models meet the physical world. I like hard problems that require scientific judgment, careful engineering, and tools that help a team discover something genuinely new.
  background: I earned my PhD through Harvard Medical School's Program in Neuroscience, studying how neural circuits organize natural behavior. Earlier, I developed microelectrodes for recording from and stimulating peripheral nerves.

quote:
  text: Spontaneous behaviour is structured by reinforcement without explicit reward.
  source: Nature, 2023 · Co-first author
